<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LULL</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23000%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223%22 fill=%22%23e0a24a%22/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{color:#d6dde3;font-family:'Space Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased}
#wrap{position:absolute;overflow:hidden;background:#000}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;pointer-events:none}
.hidden{display:none!important}
.fade{transition:opacity .8s}
/* HUD */
#hud{position:absolute;left:1.1em;top:.9em;display:flex;flex-direction:column;gap:.42em;padding:.7em .8em .6em;background:linear-gradient(90deg,rgba(4,6,9,.62),rgba(4,6,9,0));transition:opacity .6s}
.stat{display:grid;grid-template-columns:4.4em 7.6em 2.2em;align-items:center;gap:.55em;font-size:.56em;letter-spacing:.2em;color:#8f9aa6;font-weight:700}
.stat em{font-style:normal;color:#5f6a76;letter-spacing:.05em;font-weight:400;text-align:right}
.bar{position:relative;height:.62em;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.bar b,.bar i{position:absolute;left:0;top:0;bottom:0;width:100%}
.bar b{background:rgba(255,255,255,.22);transition:width .9s ease .25s}
.bar i{background:var(--c);transition:width .18s}
.stat.low span{color:#d06a5c;animation:blink 1s steps(2) infinite}
.stat.hum canvas{width:7.6em;height:1.2em;image-rendering:pixelated}
#stam{height:.16em;width:7.6em;margin-left:calc(4.4em*.56 + .55em*.56);background:rgba(255,255,255,.06);opacity:0;transition:opacity .4s}
#stam i{display:block;height:100%;background:#cfd5da;width:100%}
@keyframes blink{50%{opacity:.35}}
#objective{position:absolute;right:1.2em;top:1em;max-width:19em;text-align:right;transition:opacity .6s}
#objective small{display:block;font-size:.5em;letter-spacing:.32em;color:#6f7a86;margin-bottom:.35em}
#objText{font-family:'IM Fell English',Georgia,serif;font-size:.86em;color:#cfd5da;text-shadow:0 1px 3px #000}
#objective.flash #objText{animation:objf 1.6s}
@keyframes objf{0%{color:#f2d39b;text-shadow:0 0 .6em #e0a24a}100%{color:#cfd5da}}
#hint{position:absolute;left:50%;top:1.1em;transform:translateX(-50%);font-size:.55em;letter-spacing:.18em;color:#aab4be;background:rgba(5,7,10,.72);padding:.55em 1.1em;border:1px solid rgba(255,255,255,.08);white-space:nowrap;transition:opacity .6s}
#hint kbd{font-family:inherit;color:#f2d39b;border:1px solid rgba(242,211,155,.35);padding:0 .35em;margin:0 .15em}
#hotbar{position:absolute;left:50%;bottom:.9em;transform:translateX(-50%);display:flex;gap:.35em}
.slot{position:relative;width:2.5em;height:2.5em;background:rgba(6,8,11,.72);border:1px solid rgba(255,255,255,.09)}
.slot img{position:absolute;inset:.2em;width:calc(100% - .4em);height:calc(100% - .4em);image-rendering:pixelated}
.slot .k{position:absolute;left:.25em;top:.1em;font-size:.45em;color:#6f7a86}
.slot .n{position:absolute;right:.25em;bottom:.05em;font-size:.5em;color:#cfd5da}
.slot.eq{border-color:rgba(242,211,155,.55)}
#torchInd{position:absolute;right:1.2em;bottom:1em;font-size:.55em;letter-spacing:.2em;color:#8f9aa6;text-align:right}
#torchInd .tb{display:inline-block;width:4em;height:.5em;background:rgba(255,255,255,.08);vertical-align:middle;margin-left:.5em}
#torchInd .tb i{display:block;height:100%;background:#e8c27a}
#torchInd.off{opacity:.45}
#prompt{position:absolute;transform:translate(-50%,-100%);font-size:.55em;letter-spacing:.12em;color:#e9edf0;background:rgba(5,7,10,.78);padding:.3em .6em;white-space:nowrap;border-left:2px solid #e0a24a}
#prompt kbd{font-family:inherit;color:#f2d39b;margin-right:.45em}
#bubbles .bub{position:absolute;transform:translate(-50%,-100%);font-family:'IM Fell English',Georgia,serif;font-size:.7em;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000;white-space:nowrap;transition:opacity .4s}
#bubbles .bub.shout{font-family:'Space Mono',monospace;font-weight:700;font-size:.62em;color:#ffe7d9;letter-spacing:.06em}
#murmur{position:absolute;left:50%;bottom:4.6em;transform:translateX(-50%);width:68%;text-align:center;font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:1.02em;line-height:1.35;color:#e4e8ea;text-shadow:0 0 .5em #000,0 1px 2px #000;opacity:0;transition:opacity .9s}
#murmur.on{opacity:1}
#modal .endline{font-family:'Caveat',cursive;font-size:2.1em;color:#f4efe2;margin:1.6em 0 .1em;min-height:1.3em;transform:rotate(-1.5deg);text-shadow:0 0 .4em rgba(0,0,0,.8)}
#modal .endline.it{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:1.5em;color:#f4d9a8;transform:none;text-shadow:0 0 .7em rgba(240,170,80,.45)}
#modal .endreply{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:.85em;color:#f4d9a8;opacity:0;transition:opacity 4s;min-height:1.2em;margin-bottom:1.6em;text-shadow:0 0 .6em rgba(240,170,80,.35)}
#modal .endreply.on{opacity:.55}
#murmur.it{color:#f4d9a8;text-shadow:0 0 .6em rgba(240,170,80,.45),0 1px 2px #000}
#thought{position:absolute;left:50%;top:38%;transform:translateX(-50%) rotate(-2deg);font-family:'Caveat',cursive;font-size:1.6em;color:#f4efe2;text-shadow:0 0 .4em #000;opacity:0;transition:opacity 1.2s;white-space:nowrap}
#thought.on{opacity:.92}
#dialog{position:absolute;left:50%;bottom:1em;transform:translateX(-50%);width:72%;min-height:6.2em;padding:1em 1.4em 1.1em;background:linear-gradient(180deg,rgba(6,8,11,.88),rgba(3,4,6,.96));border:1px solid rgba(255,255,255,.08);box-shadow:0 0 3em rgba(0,0,0,.6)}
#dlgWho{font-size:.56em;letter-spacing:.32em;font-weight:700;margin-bottom:.55em;color:var(--wc,#e0a24a)}
#dlgText{font-family:'IM Fell English',Georgia,serif;font-size:1.02em;line-height:1.42;color:#e9edf0;min-height:1.4em}
#dialog.narr #dlgText{font-style:italic;color:#dfe5e8}
#dialog.narr #dlgWho{display:none}
#dialog.note #dlgText{font-family:'Caveat',cursive;font-size:1.35em;font-style:normal}
#dialog.it{border-color:rgba(242,190,110,.45);box-shadow:0 0 3em rgba(240,170,80,.18)}
#dialog.it #dlgText{color:#f4d9a8;font-style:italic;text-shadow:0 0 .6em rgba(240,170,80,.35)}
#dialog.it #dlgWho{display:none}
#recount{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;padding:0 16%;z-index:11}
#recount div{font-family:'IM Fell English',Georgia,serif;font-size:1.05em;line-height:1.5;color:#d8dde0;opacity:0;transition:opacity 1.4s;margin:.25em 0}
#recount div.on{opacity:1}
#recount div.it{color:#f2d39b;font-style:italic}
#recount div.me{font-family:'Caveat',cursive;font-size:1.45em;color:#f4efe2}
#recount .foot{position:absolute;bottom:2em;left:0;right:0;text-align:center;font-family:'Space Mono',monospace;font-size:.5em;letter-spacing:.3em;color:#5f6a76}
#dlgChoices{margin-top:.7em;display:flex;flex-direction:column;gap:.25em}
#dlgChoices div{font-size:.66em;letter-spacing:.06em;color:#8f9aa6;padding:.2em .6em;border-left:2px solid transparent}
#dlgChoices div.sel{color:#f2efe8;border-left-color:#e0a24a;background:rgba(224,162,74,.08)}
#dlgChoices div span{color:#5f6a76;margin-right:.6em}
#dlgNext{position:absolute;right:1em;bottom:.55em;font-size:.7em;color:#e0a24a;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(.2em)}}
#card{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s}
#card.on{opacity:1}
#card h1{font-family:'IM Fell English',Georgia,serif;font-weight:400;font-size:2.6em;letter-spacing:.42em;margin:0 0 .5em;padding-left:.42em;color:#e7ebee}
#card p{font-size:.62em;letter-spacing:.3em;color:#7d8893;margin:0;text-transform:uppercase}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10}
#modal{z-index:5}#fade{z-index:6}#dialog{z-index:7}#card{z-index:8}#title{z-index:9}#murmur,#thought{z-index:4}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}
.panel{background:linear-gradient(180deg,#0b0e12,#07090c);border:1px solid rgba(255,255,255,.09);padding:1.3em 1.5em;min-width:24em;max-width:40em}
.panel h2{font-family:'IM Fell English',Georgia,serif;font-weight:400;font-size:1.3em;letter-spacing:.2em;margin:0 0 .8em;color:#e7ebee}
.panel .foot{margin-top:1em;font-size:.5em;letter-spacing:.2em;color:#6f7a86}
.panel .foot kbd{font-family:inherit;color:#f2d39b}
.inv{display:grid;grid-template-columns:repeat(5,3.1em);gap:.4em}
.inv .slot{width:3.1em;height:3.1em}
.inv .slot.sel{border-color:#e0a24a;box-shadow:0 0 0 1px #e0a24a}
.invInfo{margin-top:.9em;min-height:3.6em}
.invInfo b{display:block;font-family:'IM Fell English',Georgia,serif;font-weight:400;font-size:.95em;color:#f2efe8;margin-bottom:.25em}
.invInfo p{margin:0;font-size:.58em;line-height:1.55;color:#9aa5b1}
.menu div{font-size:.75em;letter-spacing:.25em;padding:.35em .2em;color:#7d8893}
.menu div.sel{color:#f2efe8}
.menu div.sel::before{content:'— ';color:#e0a24a}
.menu div.dis{opacity:.35}
.paper{position:relative;width:26em;min-height:30em;padding:2.2em 2.4em;background:#e6dfcc;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 1.55em,rgba(80,100,140,.22) 1.55em,rgba(80,100,140,.22) calc(1.55em + 1px));color:#252536;box-shadow:0 0 3em rgba(0,0,0,.8);transform:rotate(-1.2deg);font-family:'Caveat',cursive;font-size:1.25em;line-height:1.24}
.paper.typed{font-family:'Space Mono',monospace;font-size:.62em;line-height:1.7;background:#d9dcd6;background-image:none;color:#1d2024;transform:rotate(.6deg);width:36em;min-height:auto}
.paper .pg{position:absolute;right:1.2em;bottom:.8em;font-family:'Space Mono',monospace;font-size:.45em;color:#6a6658}
.paper h3{margin:0 0 .5em;font-weight:700;font-size:1.05em}
.paper .tabs{position:absolute;left:0;right:0;top:-1.8em;display:flex;gap:.3em;justify-content:center;font-family:'Space Mono',monospace;font-size:.42em;color:#aab}
.notewrap{display:flex;flex-direction:column;align-items:center;gap:1em}
.notewrap .foot{font-family:'Space Mono',monospace;font-size:.5em;letter-spacing:.2em;color:#8f9aa6}
.notewrap .foot kbd{font-family:inherit;color:#f2d39b}
.closeup{display:flex;flex-direction:column;align-items:center;gap:.9em}
.closeup canvas{width:22em;height:22em;image-rendering:pixelated;box-shadow:0 0 3em rgba(0,0,0,.9)}
.closeup .cap{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:.95em;color:#dfe5e8;max-width:26em;text-align:center;min-height:2.6em}
.closeup .foot{font-size:.5em;letter-spacing:.2em;color:#6f7a86}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.75) 100%)}
#title h1{font-family:'IM Fell English',Georgia,serif;font-weight:400;font-size:6.2em;letter-spacing:.55em;padding-left:.55em;margin:0;color:#eef1f3;text-shadow:0 0 .4em rgba(255,255,255,.15)}
#title h1.g{animation:tg .18s steps(2) 2}
@keyframes tg{0%{text-shadow:-.06em 0 #f33,.06em 0 #3ff;transform:translateX(.04em)}100%{text-shadow:.04em 0 #f33,-.04em 0 #3ff;transform:translateX(-.03em)}}
#title .sub{font-size:.58em;letter-spacing:.5em;color:#7d8893;margin:.4em 0 3em;text-transform:uppercase}
#title .menu{text-align:center}
#title .press{font-size:.55em;letter-spacing:.4em;color:#8f9aa6;animation:blink 1.6s ease-in-out infinite}
#title .ver{position:absolute;bottom:1.2em;font-size:.45em;letter-spacing:.3em;color:#3f4852}
.glitch{animation:gl .12s steps(2) infinite}
@keyframes gl{0%{transform:translate(.08em,0);text-shadow:-.08em 0 rgba(255,40,40,.7),.08em 0 rgba(40,255,255,.7)}50%{transform:translate(-.06em,.04em);text-shadow:.07em 0 rgba(255,40,40,.7),-.07em 0 rgba(40,255,255,.7)}}
.ctrl{display:grid;grid-template-columns:auto auto;gap:.35em 1.6em;font-size:.6em;color:#aab4be}
.ctrl kbd{font-family:inherit;color:#f2d39b}
.death h1{font-family:'IM Fell English',Georgia,serif;font-weight:400;font-size:2.4em;letter-spacing:.3em;color:#e7ebee;margin:0 0 .4em}
.death p{font-size:.62em;letter-spacing:.25em;color:#8a6f6b;text-transform:uppercase;margin:0 0 2em}

/* ---- online: account / lobby overlay ---- */
#net{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78)}
#net.hidden{display:none}
.netp{min-width:30em;max-width:38em}
.netp .ni{font-size:.62em;letter-spacing:.12em;padding:.38em .3em;color:#7d8893}
.netp .ni.info{color:#9aa4ad;letter-spacing:.06em;line-height:1.5}
.netp .ni.info.big{color:#e7ebee;font-size:.72em}
.netp .ni.info.code{font-size:1.5em;letter-spacing:.5em;color:#f2d39b;text-align:center;padding:.3em 0 .5em}
.netp .ni.info.pslot{border-top:1px solid rgba(255,255,255,.05);color:#c6ced5}
.netp .ni.info.pslot b{color:#9fd38a;font-weight:400;float:right}.netp .ni.info.pslot em{color:#6f7a86;font-style:normal;float:right}
.netp .ni i{display:inline-block;width:.7em;height:.7em;margin-right:.6em;vertical-align:-.05em}
.netp .ni.btn.sel,.netp .ni.in.sel{color:#f2efe8}
.netp .ni.btn.sel::before{content:'— ';color:#e0a24a}
.netp .ni.dis{opacity:.4}
.netp .ni.in{display:flex;align-items:center;gap:1em}
.netp .ni.in span{flex:0 0 15em}
.netp input{flex:1;font:inherit;font-size:1.15em;letter-spacing:.08em;background:#05070a;color:#f2efe8;border:1px solid rgba(255,255,255,.14);padding:.35em .5em;outline:none}
.netp .ni.in.sel input{border-color:#e0a24a}
#netMsg{min-height:1.3em;font-size:.55em;letter-spacing:.08em;color:#9fd38a;margin-top:.6em}
#netMsg.err{color:#e0796a}
/* ---- co-op HUD: radio wheel, chat log, room panel ---- */
#wheel{position:absolute;left:50%;bottom:5.2em;transform:translateX(-50%);z-index:4;background:rgba(5,7,10,.88);border:1px solid rgba(255,255,255,.1);padding:.6em .9em;font-size:.55em;letter-spacing:.1em;min-width:22em}
#wheel.hidden{display:none}
#wheel h4{margin:0 0 .5em;font-weight:400;letter-spacing:.25em;color:#f2d39b}#wheel h4 small{color:#6f7a86;letter-spacing:.1em;margin-left:.8em}
#wheel div{padding:.12em 0;color:#d6dde3}#wheel kbd{font-family:inherit;color:#f2d39b;display:inline-block;width:1.6em}
#wheel .sp{margin-top:.4em;color:#9aa4ad}#wheel .sp kbd{width:4em}
#chatlog{position:absolute;left:1em;bottom:4.6em;z-index:3;font-size:.52em;letter-spacing:.06em;color:#d6dde3;text-shadow:0 0 3px #000,0 0 6px #000;max-width:30em;pointer-events:none}
#chatlog div{margin-top:.25em;transition:opacity .4s}#chatlog i{display:inline-block;width:.7em;height:.7em;margin-right:.5em;vertical-align:-.05em}
#coopPanel{position:absolute;right:1em;top:7.4em;z-index:3;font-size:.45em;letter-spacing:.14em;color:#8f9aa6;text-align:right;text-shadow:0 0 3px #000;pointer-events:none}
#coopPanel.hidden{display:none}#coopPanel i{display:inline-block;width:.7em;height:.7em;margin-right:.5em}
#netState{position:absolute;left:50%;top:1em;transform:translateX(-50%);z-index:11;font-size:.55em;letter-spacing:.2em;color:#e0796a;background:rgba(0,0,0,.7);padding:.3em .8em}
#netState.hidden{display:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="480" height="270"></canvas>
<div id="ui">
 <div id="hud" class="hidden">
  <div class="stat" data-s="health" style="--c:#b5473a"><span>HEALTH</span><div class="bar"><b></b><i></i></div><em></em></div>
  <div class="stat" data-s="hunger" style="--c:#b8873f"><span>HUNGER</span><div class="bar"><b></b><i></i></div><em></em></div>
  <div class="stat" data-s="thirst" style="--c:#4b8bab"><span>THIRST</span><div class="bar"><b></b><i></i></div><em></em></div>
  <div class="stat" data-s="sanity" style="--c:#9583bd"><span>SANITY</span><div class="bar"><b></b><i></i></div><em></em></div>
  <div class="stat hum hidden" id="humRow"><span>HUM</span><canvas id="humCv" width="76" height="12"></canvas><em></em></div>
  <div id="stam"><i></i></div>
 </div>
 <div id="objective" class="hidden"><small>OBJECTIVE</small><div id="objText"></div></div>
 <div id="hint" class="hidden"></div>
 <div id="hotbar" class="hidden"></div>
 <div id="torchInd" class="hidden"></div>
 <div id="bubbles"></div>
 <div id="prompt" class="hidden"></div>
 <div id="murmur"></div>
 <div id="thought"></div>
 <div id="dialog" class="hidden"><div id="dlgWho"></div><div id="dlgText"></div><div id="dlgChoices"></div><div id="dlgNext">&#9662;</div></div>
 <div id="fade"></div>
 <div id="card"><h1 id="cardTitle"></h1><p id="cardSub"></p></div>
 <div id="wheel" class="hidden"></div>
 <div id="chatlog"></div>

 <div id="netState" class="hidden"></div>
 <div id="modal" class="hidden"></div>
 <div id="title" class="hidden"></div>
 <div id="flash"></div>
</div>
</div>
<script>
'use strict';
// ================= CORE =================
const W=480,H=270,TS=16;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[(Math.random()*a.length)|0];
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const RNG=seed=>{let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}
function store(k,v){try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null;}localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return null;}}
function storeDel(k){try{localStorage.removeItem(k);}catch(e){}}
const GLY='█▓▒░#%&@$?/\\|~';
function corrupt(s,amt){let o='';for(const ch of s){if(ch!==' '&&Math.random()<amt)o+=Math.random()<.5?pick(GLY):ch+String.fromCharCode(0x0300+irand(0,40));else o+=ch;}return o;}

// ================= INPUT =================
const Input={down:new Set(),pressed:new Set(),
 map:{up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],
  attack:['Space','KeyJ'],interact:['KeyE','KeyK','Enter'],sprint:['ShiftLeft','ShiftRight'],dodge:['KeyQ','KeyL'],
  torch:['KeyF'],inv:['KeyI','Tab'],note:['KeyN'],pause:['Escape','KeyP'],
  s1:['Digit1'],s2:['Digit2'],s3:['Digit3'],s4:['Digit4'],s5:['Digit5'],drop:['KeyX'],ok:['KeyE','Enter','Space','KeyK']},
 is(a){return this.map[a].some(k=>this.down.has(k));},
 hit(a){return this.map[a].some(k=>this.pressed.has(k));},

// tile image cache
const TIMG=[],TIMGF=[];
function buildTiles(){
 TL.forEach(t=>{TIMG[t.id]=[];TIMGF[t.id]=[];
  for(let v=0;v<4;v++){
   const [c,x]=mkC(16,16);const r=RNG(t.id*977+v*131+7);
   if(t.wall){t.top(x,r,v);TIMG[t.id][v]=c;const [c2,x2]=mkC(16,16);x2.drawImage(c,0,0);t.face(x2,RNG(t.id*31+v),v);TIMGF[t.id][v]=c2;}
   else{t.draw(x,r,v);TIMG[t.id][v]=c;}
  }});
}

 if(f<1){r*=f;g*=f;b*=f;}else{const k=f-1;r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k;}
 return '#'+((1<<24)|((r|0)<<16)|((g|0)<<8)|(b|0)).toString(16).slice(1);}
function mix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const f=(s)=>[(s>>16)&255,(s>>8)&255,s&255];const x=f(A),y=f(B);return '#'+((1<<24)|(((x[0]+(y[0]-x[0])*t)|0)<<16)|(((x[1]+(y[1]-x[1])*t)|0)<<8)|((x[2]+(y[2]-x[2])*t)|0)).toString(16).slice(1);}

class GMap{
 constructor(id,w,h,fill){this.id=id;this.w=w;this.h=h;this.t=new Uint8Array(w*h).fill(fill||0);this.v=new Uint8Array(w*h);
  this.props=[];this.ents=[];this.lights=[];this.zones=[];this.decals=[];this.shafts=[];this.exits={};this.solids=[];this.ambient={a:.3,c:'6,8,14'};
  this.outdoor=false;this.rain=0;this.fog=0;this.snd={};this.grade=null;this.emitters=[];}
 tile(x,y){if(x<0||y<0||x>=this.w||y>=this.h)return 0;return this.t[y*this.w+x];}
 set(x,y,id){if(x<0||y<0||x>=this.w||y>=this.h)return;this.t[y*this.w+x]=id;}
 rect(x,y,w,h,id){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)this.set(i,j,id);}
 solidAt(px,py){return TL[this.tile(Math.floor(px/16),Math.floor(py/16))].solid;}
 opaqueAt(px,py){return TL[this.tile(Math.floor(px/16),Math.floor(py/16))].opaque;}
 ascii(rows,leg,ox=0,oy=0){rows.forEach((row,j)=>{for(let i=0;i<row.length;i++){const ch=row[i];if(leg[ch]!==undefined)this.set(ox+i,oy+j,T[leg[ch]]);}});}
 // props: base point = bottom-centre in px
 prop(name,x,y,o={}){const d=PROP[name];const p={kind:'prop',name,x,y,o,d,layer:d.layer!==undefined?d.layer:1,interact:o.interact||null,hidden:false};
  if(d.box&&!o.nobox){p.box={x0:x+d.box[0],y0:y+d.box[1],x1:x+d.box[0]+d.box[2],y1:y+d.box[1]+d.box[3]};this.solids.push(p.box);}
  if(d.light&&o.on){this.light(x,y+(d.light.dy||0),d.light.r,d.light.i,d.light.c,{prop:p,head:d.light.head});}
  this.props.push(p);return p;}
 light(x,y,r,i,c,o={}){const L=Object.assign({x,y,r,i,c:c||'255,220,180',on:true,flick:0},o);this.lights.push(L);return L;}
 zone(x,y,w,h,fn,o={}){const z=Object.assign({x,y,w,h,fn,once:true,done:false},o);this.zones.push(z);return z;}
 exit(tx,ty,label,fn){this.exits[tx+','+ty]={label,fn};}
 finalize(){
  const r=RNG(hashStr(this.id));
  for(let i=0;i<this.v.length;i++)this.v[i]=(r()*4)|0;
  this.lights.forEach(L=>{if(!L.cone)L.poly=castPoly(this,L.x,L.y,L.r,0,Math.PI*2,72);});
 }
}
function castPoly(m,x,y,r,a0,a1,n){
 const pts=[x,y];
 for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,dx=Math.cos(a),dy=Math.sin(a);let d=0,hit=false;
  while(d<r){d+=2.5;if(m.opaqueAt(x+dx*d,y+dy*d)){hit=true;break;}}
  if(hit)d=Math.min(r,d+7);else d=r;
  pts.push(x+dx*d,y+dy*d);}
 return pts;
}

function blocked(m,x,y,hw,hh,self){
 const x0=x-hw,x1=x+hw-.01,y0=y-hh,y1=y-.01;
 if(m.solidAt(x0,y0)||m.solidAt(x1,y0)||m.solidAt(x0,y1)||m.solidAt(x1,y1))return true;
 for(const b of m.solids)if(x1>b.x0&&x0<b.x1&&y1>b.y0&&y0<b.y1)return true;
 for(const e of m.ents)if(e!==self&&e.solid&&!e.dead&&!e.hidden){const b=e.hbox();if(x1>b.x0&&x0<b.x1&&y1>b.y0&&y0<b.y1)return true;}
 if(self!==P&&self&&self.solid!==false&&G.map===m){const b=P.hbox();if(x1>b.x0&&x0<b.x1&&y1>b.y0&&y0<b.y1)return true;}
 return false;
}
function moveActor(a,dx,dy){
 const m=G.map;
 if(dx){const nx=a.x+dx;if(!blocked(m,nx,a.y,a.hw,a.hh,a))a.x=nx;else{a.bumpX=true;}}
 if(dy){const ny=a.y+dy;if(!blocked(m,a.x,ny,a.hw,a.hh,a))a.y=ny;else{a.bumpY=true;}}
}

 if(mag&&p.swing<0&&p.dodgeT<=0){p.fx=ix;p.fy=iy;p.dir=Math.abs(ix)>Math.abs(iy)?(ix<0?1:2):(iy<0?3:0);}

const INV_MAX=10;
function hasItem(id){return G.inv.some(s=>s.id===id);}
function countItem(id){const s=G.inv.find(s=>s.id===id);return s?s.n:0;}
function giveItem(id,n=1,quiet){
 const s=G.inv.find(s=>s.id===id);
 if(s&&!ITEMS[id].weapon&&!ITEMS[id].key)s.n+=n;
 else if(!s){if(G.inv.length>=INV_MAX){murmur('Your bag is full.');return false;}G.inv.push({id,n});}
 if(!quiet)toast((n>1?n+' × ':'')+ITEMS[id].name);
 if(ITEMS[id].weapon&&!G.equip){G.equip=id;}
 if(ITEMS[id].clue)G.flags['clue_'+ITEMS[id].clue]=1;
 UI.hotbar();return true;}
function takeItem(id,n=1){const s=G.inv.find(s=>s.id===id);if(!s)return;s.n-=n;if(s.n<=0){G.inv=G.inv.filter(q=>q!==s);if(G.equip===id)G.equip=null;}UI.hotbar();}
function useItem(id){
 const it=ITEMS[id];if(!it)return;
 if(it.weapon){G.equip=G.equip===id?null:id;Snd.play('ui');toast(G.equip?'Equipped: '+it.name:'Put away: '+it.name);UI.hotbar();return;}
 if(id==='notebook'){UI.notebook();return;}
 if(id==='torch'){if(G.modal==='inv')UI.closeModal();if(P.battery>0){P.torch=!P.torch;Snd.play('torch');}else murmur('The torch is dead. You need batteries.');return;}
 if(!it.use){murmur(it.desc);return;}
 const u=it.use,s=G.stats;
 if(u.battery){if(!hasItem('torch')){murmur('You don’t have anything to put these in.');return;}P.battery=Math.min(100,P.battery+u.battery);}
 if(u.health)s.health=Math.min(100,s.health+u.health);
 if(u.hunger)s.hunger=clamp(s.hunger+u.hunger,0,100);
 if(u.thirst)s.thirst=clamp(s.thirst+u.thirst,0,100);
 if(u.sanity)s.sanity=Math.min(100,s.sanity+u.sanity);
 Snd.play(it.sfx||'pickup');takeItem(id,1);
}

const PEND={pend:1};
const Script={cur:null,q:[],
 run(fn){const g=typeof fn==='function'?fn():fn;if(!g||!g.next)return;if(this.cur){this.q.push(g);return;}this.cur=g;this.step();},
 busy(){return !!this.cur;},
 step(v){while(this.cur){let r;try{r=this.cur.next(v);}catch(e){console.error(e);r={done:true};}
   if(r.done){this.cur=null;G.cut=false;if(this.q.length){this.cur=this.q.shift();v=undefined;continue;}return;}
   const c=r.value;if(c===undefined||c===null){v=undefined;continue;}
   const res=this.exec(c);if(res===PEND)return;v=res;}},
 resume(v){G.timers.push({t:0,fn:()=>this.step(v),raw:1});},
 kill(){this.cur=null;this.q=[];G.cut=false;UI.closeDlg();},
 exec(c){
  switch(c.t){
   case 'say':{G.cut=true;const o=Object.assign({},c.o||{});if(c.who==='N'&&G.sanityOn&&G.stats.sanity<18&&!G.lull)o.corrupt=.05+(18-G.stats.sanity)/120;UI.say(c.who,c.text,o,()=>this.resume());return PEND;}
   case 'choice':G.cut=true;UI.choice(c.who,c.text,c.opts,i=>this.resume(i));return PEND;
   case 'wait':G.cut=c.lock!==false;G.timers.push({t:c.s,fn:()=>this.step()});return PEND;
   case 'card':G.cut=true;UI.card(c.title,c.sub,()=>this.resume(),c.hold);return PEND;
   case 'fade':G.cut=true;UI.fade(c.to,c.d,()=>this.resume());return PEND;
   case 'cu':UI.closeup(c.kind,c.state);return UI.cu.state;
   case 'cuClose':UI.cuClose();return;
   case 'phone':G.cut=true;UI.phone(c.html);UI.onModalClose=()=>this.resume();return PEND;
   case 'note':addNote(c.n);UI.notebook();UI.noteI=G.notes.length-1;UI.noteDraw();UI.onModalClose=()=>this.resume();G.cut=true;return PEND;
   case 'walk':G.cut=c.lock!==false;c.ent.target=[c.x,c.y];c.ent.onArrive=()=>this.resume();return PEND;
   case 'go':G.cut=true;Story.goto(c.phase,c.o||{},()=>this.resume());return PEND;
   case 'until':G.waiters.push({cond:c.cond,fn:()=>this.resume()});return PEND;
  }
  return;
 }
};

class Vehicle extends Actor{
 constructor(x,y,dirx,type,c){super(x,y,{});this.kind='veh';this.dx=dirx;this.type=type;this.c=c||0;this.sp=type==='bus'?40:55;this.hw=type==='bus'?34:16;this.hh=10;this.solid=true;}
 hbox(){return{x0:this.x-this.hw,y0:this.y-this.hh,x1:this.x+this.hw,y1:this.y};}
 update(dt){const front=this.x+this.dx*(this.hw+4);const blockedP=Math.abs(P.y-this.y+4)<14&&((this.dx>0&&P.x>this.x&&P.x-front<26)||(this.dx<0&&P.x<this.x&&front-P.x<26));
  if(!blockedP)this.x+=this.dx*this.sp*dt;else if(!this.honk){this.honk=1;Snd.tone(330,.25,{type:'square',vol:.03,lp:900});setTimeout(()=>this.honk=0,2500);}
  if(this.dx>0&&this.x>G.map.w*16+60)this.x=-60;if(this.dx<0&&this.x<-60)this.x=G.map.w*16+60;}
 draw(c,ox,oy){const d=PROP[this.type];const img=HDon()&&HD2Q[this.type]?propImg2(this.type,{c:this.c}):propImg(this.type,{c:this.c});c.save();const X=(q(this.x)-ox),Y=(q(this.y)-oy);if(this.dx<0){c.translate(X,0);c.scale(-1,1);c.drawImage(img,-d.w/2,Y-d.h,d.w,d.h);}else c.drawImage(img,X-d.w/2,Y-d.h,d.w,d.h);c.restore();
  // headlights
  c.globalCompositeOperation='lighter';const hx=X+this.dx*this.hw;const g=c.createRadialGradient(hx,Y-6,0,hx+this.dx*20,Y-6,34);g.addColorStop(0,'rgba(255,240,200,.25)');g.addColorStop(1,'rgba(255,240,200,0)');c.fillStyle=g;c.fillRect(hx-40,Y-40,80,60);c.globalCompositeOperation='source-over';}
}

// ================= MAIN LOOP =================
function update(dt){
 G.time+=dt;G.dt=dt;Snd.update(dt);
 // timers
 if(!G.paused&&G.state!=='dead'){const ts=G.timers;G.timers=[];for(const tm of ts){tm.t-=dt;if(tm.t<=0)tm.fn();else G.timers.push(tm);}
  const ws=G.waiters;G.waiters=[];for(const w of ws){if(w.cond())w.fn();else G.waiters.push(w);}}
 if(UI.cu)UI.cuDraw(dt);
 if(UI._rstep)UI._rstep(dt);
 if(NetUI.open)NetUI.tick(dt);
 if(G.state==='title'){UI.menuKeys();if(G.modal==='ctrl'&&Input.hit('ok'))UI.closeModal();G.cam.x+=dt*9;if(G.cam.x>tx(54))G.cam.x=tx(8);G.map&&G.map.ents.forEach(e=>e.update&&e.update(dt));updateParticles(dt);if(Math.random()<dt*.3){$('#tt')&&$('#tt').classList.remove('g');void($('#tt')||{}).offsetWidth;$('#tt')&&$('#tt').classList.add('g');}return;}
 if(G.state==='dead'||G.state==='end'){UI.menuKeys();return;}
 if(G.coop)NetGame.preInput(dt);
 if(G.modal==='pause'){UI.menuKeys();if(Input.hit('pause')){UI.closeModal();G.paused=false;}if(!G.coop)return;}
 else if(G.modal==='ctrl'){if(Input.hit('ok')||Input.hit('pause'))UI.closeModal();if(!G.coop)return;}
 if(G.modal==='inv'){UI.invKeys();}
 else if(G.modal==='note'){UI.noteKeys();}
 else if(G.modal==='phone'){if(Input.hit('ok')){Input.eat('ok');UI.closeModal();}}
 UI.updDlg(dt);
 if(G.hitstop>0){G.hitstop-=dt;return;}
 if(canAct()){
  if(Input.hit('inv'))UI.inv();else if(Input.hit('note'))UI.notebook();else if(Input.hit('pause'))UI.pause();
  else for(let i=0;i<5;i++)if(Input.hit('s'+(i+1))&&G.inv[i])useItem(G.inv[i].id);}
 G.humNear=0;
 // short grace after any conversation/announcement so nothing hits you the instant it closes
 {const busy=!!(G.cut||(G.modal&&G.modal!=='inv'));if(G.wasBusy&&!busy)P.graceT=1.2;G.wasBusy=busy;P.graceT-=dt;}
 updatePlayer(dt);
 if(G.coop)NetGame.tick(dt);
 unstick(dt);
 for(const e of G.map.ents.slice())e.update(dt);
 if(G.map.tick)G.map.tick(dt);
 if(G.extraBodies)for(const e of G.extraBodies)e.update(dt);
 // zones
 for(const z of G.map.zones){if(z.done)continue;if(P.x>z.x&&P.x<z.x+z.w&&P.y>z.y&&P.y<z.y+z.h&&!G.cut){if(z.once)z.done=true;const r=z.fn();if(r&&r.next)Script.run(r);}}
 // interaction
 // walking into a doorway uses it
 {const k=Math.floor(P.x/16)+','+Math.floor((P.y-1)/16);const ex=G.map.exits[k];if(ex&&canAct()&&!G.lull&&P.moving&&!Script.busy()){if(G.lastExit!==k){G.lastExit=k;Script.run(ex.fn);}}else if(!ex)G.lastExit=null;}
 const tgt=canAct()&&!G.lull&&!P.pose&&!Script.busy()?findTarget():null;UI.prompt(tgt);
 if(tgt&&Input.hit('interact')&&!Script.busy()){Input.eat('interact');tgt.fn();}
 if(G.flags.ringing&&!G.flags.ellie_call){G.ringT-=dt;if(G.ringT<=0){Snd.play('ring',{n:1});G.ringT=3.2;}}
 updateStats(dt);updateSanityFx(dt);if(G.lull)updateLull(dt);
 updateParticles(dt);
 // camera
 const k=1-Math.exp(-dt*5);G.cam.x=lerp(G.cam.x,P.x+P.fx*12,k);G.cam.y=lerp(G.cam.y,P.y-10+P.fy*8,k);
 G.shake=Math.max(0,G.shake-dt*18);G.shakeX=G.shake?rand(-G.shake,G.shake):0;G.shakeY=G.shake?rand(-G.shake,G.shake):0;
 G.redFlash=Math.max(0,G.redFlash-dt*1.5);if(!G.lull)G.whiteFlash=Math.max(0,G.whiteFlash-dt*2);
 mirrorHist.unshift({dir:P.dir,x:P.x});if(mirrorHist.length>20)mirrorHist.pop();
 // sound
 const hv=G.showHum?(G.lull?.11:.012+G.stats.hum/100*.045+G.humNear*.05):0;Snd.set('hum',hv,.6);
 if(G.showHum&&!G.lull)Snd.humPitch(1+G.humNear*.04);
 UI.hud();UI.bubbles();for(const b of G.bubbles)b.t-=dt;
}

function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);render();}catch(e){console.error(e);}Input.end();requestAnimationFrame(frame);}

 buildTiles();buildHollow();buildHollow2();buildIcons();buildIconCanvases();buildFx();UI.layout();addEventListener('resize',()=>UI.layout());
 Game.toTitle();requestAnimationFrame(frame);
 window.LULL={G,P,Story,Script,Snd,loadPhase,Game,startLull,die};
}

// push the player out of walls/solid furniture if they ever end up inside one
function stuckIn(m,x,y){const x0=x-P.hw,x1=x+P.hw-.01,y0=y-P.hh,y1=y-.01;
 if(m.solidAt(x0,y0)||m.solidAt(x1,y0)||m.solidAt(x0,y1)||m.solidAt(x1,y1))return true;
 for(const b of m.solids)if(x1>b.x0&&x0<b.x1&&y1>b.y0&&y0<b.y1)return true;return false;}
function unstick(){const m=G.map;if(!m||G.state!=='play'||G.cut||P.pose||!stuckIn(m,P.x,P.y))return;
 for(let r=2;r<=48;r+=2)for(let a=0;a<16;a++){const nx=P.x+Math.cos(a*Math.PI/8)*r,ny=P.y+Math.sin(a*Math.PI/8)*r;if(!stuckIn(m,nx,ny)){P.x=nx;P.y=ny;return;}}}

const CALM_STYLES=['c1','c2','c3','c4','c5','c6','p1','p2','p3','p5','t3','jogger'];
class Calm extends Actor{
 constructor(x,y,style,o={}){super(x,y,o);this.kind='calm';this.style=style;this.solid=false;this.hw=3;this.hh=3;this.sp=o.sp||50;this.ring=o.ring||28;this.ang=o.ang||0;this.touchCd=rand(2,4);this.stepT=rand(.3);this.frozen=false;}
 seen(){const dx=this.x-P.x,dy=this.y-P.y,d=Math.hypot(dx,dy)||1;if(d>230)return false;return (dx*P.fx+dy*P.fy)/d>0.42;}
 update(dt){
  if(G.cut||(G.modal&&G.modal!=='inv')||G.state!=='play'){this.moving=false;return;}
  const d=dist(this.x,this.y,P.x,P.y);this.touchCd-=dt;this.frozen=this.seen();
  if(this.frozen){this.moving=false;this.face(P.x-this.x,P.y-this.y);return;}
  let ax=this.x-P.x,ay=this.y-P.y;const l=Math.hypot(ax,ay)||1;ax/=l;ay/=l;
  let gx=P.x+ax*this.ring+this.ang*8,gy=P.y+ay*this.ring*.7+this.ang*12;
  const h=G.crowdHold;if(h){if(h.x!==undefined)gx=Math.max(gx,h.x+Math.abs(this.ang)*30);if(h.y!==undefined)gy=Math.min(gy,h.y-Math.abs(this.ang)*18);}
  if(dist(this.x,this.y,gx,gy)>3)this.walkTo(gx,gy,this.sp,dt);else this.moving=false;
  if(this.stuck>2.5&&d>220){this.x=P.x-P.fx*240;this.y=P.y-P.fy*60;if(blocked(G.map,this.x,this.y,3,3,this)){this.x=P.x-P.fx*120;this.y=P.y;}this.stuck=0;}
  if(this.moving&&d<170){this.stepT-=dt;if(this.stepT<=0){this.stepT=.36;Snd.play('step',{s:'road',v:.45});}}
  if(d<15&&this.touchCd<=0&&!h){this.touchCd=9;calmTouch();}
  this.anim+=dt*(this.moving?7:0);
 }
 draw(c,ox,oy){const truth=G._truthPass||(G.truthNow&&!G.lull);const fr=this.moving?((this.anim|0)%4)+1:0;
  drawHum(c,this.style,this.dir,this.moving?'walk':'idle',fr,{smile:!truth,dead:truth},q(this.x-8)-ox,q(this.y-24)-oy);}
}

function recountLines(me){
 const f=G.flags,L=[],I=me?'I':'You',my=me?'my':'your';
 L.push(me?'Day 2. My glove tore, and something cold got in.':'Day 2. Your glove tore. That was when we met.');
 if(f.stoleBox)L.push(me?'That same night I stole a dead man’s blood out of an ambulance. Colindale waited for it for weeks.':'That same night you stole Mr Pell’s blood out of an ambulance. Colindale never got it. I liked that.');
 if(f.lena===1)L.push(me?'I gave Lena both bottles of water. She made her daughter’s formula with them.':'You gave Lena both bottles of water. She made her daughter’s formula with them. Thank you.');
 else if(f.lena===2)L.push(`${I} split the water with Lena. One bottle was enough.`);
 else if(f.lena===0)L.push(me?'I kept the water from Lena. She hated me for it. It was the only thing I got right that day.':'You kept the water from Lena. That one got away from us.');
 if(f.farrowFree)L.push(me?'I let Farrow out of the cage. He walked into the Wardens’ camp and shared their supper. Cole was right.':'You let Farrow out. He shared the Wardens’ supper. They are all sleeping now.');
 else if(f.farrowLeft)L.push(`${I} left Farrow in the cage. The Wardens’ water stayed clean.`);
 if(f.inf_theo)L.push(me?'I gave Theo my water. He fell asleep on the platform at Bethnal Green, smiling, and I left him there.':'You gave Theo your water. He is sleeping on the platform at Bethnal Green.');
 else if(f.theoWater===0)L.push(`${I} wouldn’t give Theo ${my} water. He is alive.`);
 if(f.theoSent)L.push('Theo went in through the gate. Alone. Clean.');
 if(f.inf_halloran)L.push(`${I} shared Mr Halloran’s tea. The insulin ${me?'I':'you'} fetched for him didn’t matter in the end.`);
 else if(f.hTea===0)L.push(`${I} wouldn’t drink Mr Halloran’s tea. He is still doing card tricks.`);
 if(f.inf_pub)L.push(me?'I gave Poppy my cordial while her father wasn’t looking. She fell asleep in his arms that night. He followed her.':'You gave Poppy your cordial. She is sleeping in her father’s arms. Soon he will be too.');
 else if(f.pubRefused)L.push(`${I} didn’t give Poppy anything. Her fever was only a fever.`);
 const k=f.kills||0;
 if(k>0){L.push(me?`I killed ${k} ${k===1?'person':'people'}. They were not Hollowed. They were frightened of me, and they were right.`:`You killed ${k} of the frightened ones. I made them look like monsters for you. It was easier for both of us.`);
  if(f.clue_idcard)L.push('Amara Osei. Year 9.');if(f.clue_ring)L.push('A & J, always.');if(f.clue_inhaler)L.push('Someone who needed an inhaler.');if(f.clue_filter)L.push('Someone who was very careful about what they drank.');}
 else L.push(me?'I never killed anyone. Not one. I’m holding on to that.':'You never killed any of them. That was inconvenient.');
 L.push('Biscuit knew. From the first morning.');
 if(f.maraMet)L.push(me?'Mara knew. My pupils didn’t change.':'Mara knew. Your pupils don’t change.');
 if(f.clue_notes)L.push(me?'And I knew. Day 9: Don’t trust how calm you feel.':'And you knew. Day 9: “Don’t trust how calm you feel.” I’m sorry I made you forget.');
 L.push(me?'I’m not calm now. Good.':'None of it was your fault. All of it was you.');
 return L;
}

 label(s){if(!s)return'nothing saved';return`Stage ${s.stage} · ${s.endings} ending${s.endings===1?'':'s'}`+(s.t?` · ${new Date(s.t).toLocaleDateString(undefined,{day:'numeric',month:'short'})} ${new Date(s.t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}`:'');},

class CoHollow extends Hollow{
 constructor(x,y,o){super(x,y,o);this.sx=x;this.sy=y;this.lungeT=0;this.tgt=null;}
 targets(){const a=[];if(!NetGame.down&&!P.hidden)a.push(P);for(const r of Net.remotes.values())if(!r.hidden&&!r.dn&&r.m===G.map.id)a.push(r);return a;}
 update(dt){if(this.dead)return;this.flash-=dt;this.jit+=dt;
  const dP=dist(this.x,this.y,P.x,P.y);if(dP<130)G.humNear=Math.max(G.humNear,1-dP/130);

  const T=this.targets();let tg=this.tgt&&T.includes(this.tgt)?this.tgt:null,best=1e9;
  for(const a of T){const d=dist(this.x,this.y,a.x,a.y)*(a===tg?.75:1);if(d<best){best=d;tg=a;}}
  this.tgt=tg;const tx=tg?tg.x:this.hx,ty=tg?tg.y:this.hy,d=tg?dist(this.x,this.y,tx,ty):1e9;

    if(this.wx!==undefined&&dist(this.x,this.y,this.wx,this.wy)>3)this.walkTo(this.wx,this.wy,14,dt);

 },

  const doc=npc(G.map,tx(11),ty(8)+6,'doctor',{fixedDir:3});G.docNpc=doc;
  yield wait(.8);
  yield say('DOCTOR','Put the box in the hatch, please. Then stand on the cross.');
  takeItem('specbox');Snd.play('ui');yield N('The hatch swallows the box. A tray slides away on the other side.');
  yield say('DOCTOR','Thank you. Look at the light for me.');UI.flash('#fff',.6,.5);yield wait(1);
  yield say('DOCTOR','…');yield say('DOCTOR','Your pupils don’t change.');
  yield say('DOCTOR','Sleeve up, please. Arm in the port.');
  yield N('A gloved hand through the glass. A scratch. That’s all.');
  doc.fixedDir=undefined;yield walk(doc,tx(15),ty(10)+4);doc.fixedDir=1;
  Snd.set('hum',.06,2);yield wait(2.5);
  yield it('This isn’t in.');
  G.glitch=.4;Snd.play('glitch');
  yield IT('There is glass.');
  yield IT('Tell her you are fine.');
  UI.hudGlitch(.8);G.glitch=.6;Snd.play('glitch');
  yield IT('TELL HER.');
  yield walk(doc,tx(11),ty(8)+6);doc.fixedDir=3;
  yield say('DOCTOR','It’s the same thing that’s in the box. But in you there’s… so much more of it. Organised.');
  yield say('DOCTOR','You carried it all the way here. And then you handed it to us. Both of you, really.');
  const c=yield ask(['“Can you stop it?”','“Am I still me?”']);
  if(c===0){yield say('DOCTOR','Not yet. But it can’t live in salt water, and it can’t get through a door it can’t open.');yield say('DOCTOR','And now it’s in a room where every door is shut.');}
  else{yield say('DOCTOR','You came to the door with the box instead of the door with your sister behind it.');yield say('DOCTOR','I think that was you.');}
  const el=npc(G.map,tx(3),ty(10)+4,'ellie',{speed:30,clean:1});
  yield walk(el,tx(8),ty(8)+6);el.fixedDir=3;
  yield say('ELLIE','Ro.');yield say('ELLIE','They said I can come every day.');
  if(f.theoSent){const th=npc(G.map,tx(3),ty(10)+4,'theo',{scale:.8,clean:1,speed:34});yield walk(th,tx(6),ty(9)+4);th.fixedDir=3;yield N('Behind her, a boy waves. Theo.');}
  yield ME('Hi, El.');
  yield N('She puts her hand flat on the glass. You put yours against it.');
  P.pose=null;P.dir=0;
  yield ME('It’s cold.');yield say('ELLIE','It’s always cold in here. I’ll bring you a jumper.');
  Snd.set('hum',.04,3);yield wait(2);
  yield IT('They’re watching us.');
  yield IT('That’s alright.');
  yield IT('They have doors. Doors open, in the end.');
  yield IT('We are very patient.');
  yield fade(1,3);
  yield recount(recountLines(false),'it','Behind glass. Here is everything you carried.');
  yield {t:'ending',id:'sample'};},
});

// the room behind the north door
function buildIso(){
 const m=new GMap('iso',22,15,T.C);
 m.rect(6,2,10,5,T.lino);
 for(let x=5;x<=16;x++)m.set(x,7,T.V);
 m.rect(2,8,18,5,T.lino);m.set(5,4,T.glassDoor);
 m.ambient={a:.72,c:'8,12,16'};m.snd={buzz:.02,room:.05,drone:.04};m.outdoor=false;
 m.light(tx(10),ty(3)-6,96,.9,'225,240,255',{gk:.45});
 const L2=m.light(tx(10),ty(10),120,.85,'200,235,230',{gk:.4});L2.flicker=5.1;
 m.light(tx(17),ty(10),70,.6,'200,235,230',{gk:.4});
 m.grade={c:'rgba(150,210,200,.2)',op:'soft-light'};
 m.prop('hbed',tx(13),ty(4)+14);m.prop('trolley',tx(8),ty(6)+4);
 m.prop('hood',tx(4),ty(9)+6,{on:1});m.prop('bench2',tx(11)+8,ty(12)+2,{v:'micro beak'});m.prop('sfridge',tx(18),ty(9)+4);m.prop('desk',tx(16),ty(12)+2,{on:true});
 m.decals.push((c,ox,oy)=>{c.strokeStyle='rgba(190,60,50,.55)';c.lineWidth=1;const X=tx(10)-ox,Y=ty(5)-oy;c.beginPath();c.moveTo(X-4,Y-4);c.lineTo(X+4,Y+4);c.moveTo(X+4,Y-4);c.lineTo(X-4,Y+4);c.stroke();});
 m.finalize();return m;}
BUILD.iso=buildIso;
PHASES.a3_iso={map:'iso',spawn:[tx(7),ty(4)],dir:2,enter:S.a3Iso,nocp:1,clock:'05:40'};
ENDINGS.sample=['THE SAMPLE','Behind the glass, something is being very patient.'];
function epilogueSample(){const f=G.flags,L=['In March, they made a test out of what was in the box.','In May, they made a better one, out of what was in you.'];
 if(f.theoSent)L.push('Theo was the first child tested. Clean.');
 L.push('Every morning, Ellie brings two cups of tea to the glass, and drinks them both.');
 L.push('Some mornings, Rowan smiles at nothing.');
 return `<div style="margin-top:1.4em;font-family:'IM Fell English',serif;font-size:.9em;line-height:1.6;color:#aab4be">${L.join('<br>')}</div>`;}

// Day 3: the theft is on the news
{const old=S.d3Wake;S.d3Wake=function*(){yield* old();
  if(F().stoleBox)G.timers.push({t:4,fn:()=>{Snd.play('ui');murmur('Your phone buzzes. BBC News: Police appeal after medical samples taken from ambulance in Bow.',6);
   G.timers.push({t:6.5,fn:()=>murmur('Nobody will know it was you.',4)});}});};}

boot();
