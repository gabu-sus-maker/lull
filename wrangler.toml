# LULL server — Cloudflare Worker + Durable Objects.
# Cloudflare reads this file when it builds from your GitHub repo. You don't need to edit it.
name = "lull"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The game files in /public are served directly (free, unlimited).
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones the Free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Accounts", "Room"]

[vars]
# Daily budget of incoming multiplayer messages used for the usage meter and warnings
# (Free plan: 100,000 requests/day). It warns; it doesn't block.
DAILY_BUDGET = "90000"
# New accounts allowed per network per day (a whole school shares one network).
SIGNUP_LIMIT = "40"
